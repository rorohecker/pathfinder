name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install WiX Toolset
        run: choco install wixtoolset -y

      - name: Add NSIS and WiX to PATH
        shell: pwsh
        run: |
          $nsis = "C:\Program Files (x86)\NSIS"
          $wix = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          if (-not (Test-Path $wix)) {
            $wix = (Get-ChildItem "C:\Program Files (x86)\WiX Toolset *" -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName + "\bin"
          }
          echo "$nsis" >> $env:GITHUB_PATH
          echo "$wix" >> $env:GITHUB_PATH

      - name: Build release installers
        working-directory: src-tauri
        shell: pwsh
        run: .\windows\pack.ps1

      - name: Upload installers to release
        # Creates/updates the tag release only once the installers exist so
        # /releases/latest never points at an empty tag (that made older
        # Pathfinder builds open GitHub instead of downloading).
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
