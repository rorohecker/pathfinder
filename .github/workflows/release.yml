name: Release

on:
  push:
    tags:
      - 'v*'
  # Rebuild installers from a chosen ref (usually main after a compile fix)
  # and attach them to an existing tag. Tag pushes still use github.ref_name.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach installers to (e.g. v1.0.18)'
        required: true
        type: string

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Fail fast before NSIS/WiX/pack so a compile error cannot spend 15+
      # minutes and still leave /releases/latest without installers.
      - name: Check
        working-directory: src-tauri
        run: cargo check --locked

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked -- -D warnings

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install WiX Toolset
        run: choco install wixtoolset -y

      - name: Add NSIS and WiX to PATH
        shell: pwsh
        run: |
          $nsis = "C:\Program Files (x86)\NSIS"
          $wix = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          if (-not (Test-Path $wix)) {
            $wix = (Get-ChildItem "C:\Program Files (x86)\WiX Toolset *" -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName + "\bin"
          }
          echo "$nsis" >> $env:GITHUB_PATH
          echo "$wix" >> $env:GITHUB_PATH

      - name: Build release installers
        working-directory: src-tauri
        shell: pwsh
        run: .\windows\pack.ps1

      - name: Upload installers to release
        # Creates/updates the tag release only once the installers exist so
        # /releases/latest never points at an empty tag (that made older
        # Pathfinder builds open GitHub instead of downloading).
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
